name: Check script bug
description: check_deck.py crashes, or reports a pass or fail that is wrong
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      render: shell
      placeholder: python3 scripts/check_deck.py deck.pptx --profile read
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error, or the check entry from the JSON that is wrong (number, status, value, evidence).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it have reported?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Python 3.12, LibreOffice 24.2, macOS / Linux / claude.ai sandbox
