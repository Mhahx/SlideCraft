name: Deck feedback
description: A deck SlideCraft built or checked that looks wrong, generic or off-brief
labels: [feedback]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where did you use it?
      options: [Claude Code, Claude app (claude.ai or desktop), Claude for PowerPoint, other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SlideCraft version
      description: metadata.version in SKILL.md, or the release you installed
      placeholder: 0.20-draft
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [read, talk, pitch, update, not sure]
  - type: textarea
    id: request
    attributes:
      label: What did you ask for?
      description: Your request and your answers to the question round, as far as you can share them.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Name the slide numbers. Screenshots help. Say whether the check script reported it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would have been right?
